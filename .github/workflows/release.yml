name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: github.repository == 'spinels/overman'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      # ensure gem can be built and installed, push to rubygems.org
      - run: gem build overman.gemspec --output overman.gem
      - run: gem install overman.gem
      - name: Attest gem
        run: gem exec sigstore-cli sign overman.gem --bundle overman.gem.sigstore.json
      - run: gem push overman.gem --attestation overman.gem.sigstore.json
